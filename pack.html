<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Name them all. A map quiz in the spirit of Globle." />
    <title>The Counties</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <p id="eyebrow" class="eyebrow"></p>
        <h1 id="heading"></h1>
        <div class="topbar-actions">
          <a class="icon-btn home-btn" href="/" aria-label="Home — all quizzes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18">
              <path d="M3.2 10.4 12 3.2l8.8 7.2" />
              <path d="M5.4 9.1v11.7h13.2V9.1" />
              <path d="M10 20.8v-4.6h4v4.6" />
            </svg>
          </a>
          <button id="help" class="icon-btn" type="button" aria-label="How to play">?</button>
        </div>
      </header>

      <section class="stats" aria-label="Progress">
        <div>
          <span id="found-count">0</span>
          <small id="found-total"></small>
        </div>
        <div>
          <span id="timer">0:00</span>
          <small>time</small>
        </div>
        <div>
          <span id="guess-count">0</span>
          <small>guesses</small>
        </div>
        <div>
          <span id="best">—</span>
          <small>best</small>
        </div>
      </section>

      <main class="stage">
        <div class="map-wrap">
          <svg id="map"></svg>
        </div>

        <aside id="named" class="rail" aria-label="Named places">
          <div class="rail-head">
            <h2>Named</h2>
            <button id="rail-close" type="button" class="ghost rail-close">Close</button>
          </div>
          <ul id="found-list"></ul>
          <p id="named-empty" class="rail-empty" hidden></p>
          <p id="legend" class="legend"></p>
        </aside>
      </main>

      <footer class="dock">
        <p id="status" data-kind="idle" role="status"></p>
        <form id="guess-form">
          <label class="sr-only" id="guess-label" for="guess">Name</label>
          <input
            id="guess"
            name="guess"
            type="text"
            autocomplete="off"
            autocapitalize="words"
            spellcheck="false"
            placeholder=""
          />
          <button type="submit">Guess</button>
        </form>
        <div class="actions">
          <button id="named-toggle" type="button" class="ghost named-toggle" aria-expanded="false" aria-controls="named">Named</button>
          <button id="give-up" type="button" class="ghost">Reveal remaining</button>
          <button id="start-over" type="button" class="ghost" hidden>Start over</button>
        </div>
        <p id="credit" class="credit"></p>
      </footer>
    </div>

    <dialog id="help-dialog" class="sheet" aria-labelledby="help-title">
      <h2 id="help-title">How to play</h2>
      <p id="help-intro"></p>
      <ul id="help-list"></ul>
      <button type="button" data-close>To the map</button>
    </dialog>

    <dialog id="win-dialog" class="sheet win" aria-labelledby="win-title">
      <h2 id="win-title"></h2>
      <p id="win-summary"></p>
      <div class="win-actions">
        <button type="button" id="share">Share</button>
        <button type="button" data-close class="ghost">Close</button>
      </div>
    </dialog>

    <dialog id="confirm-dialog" class="sheet" aria-labelledby="confirm-title">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="win-actions">
        <button type="button" id="confirm-accept"></button>
        <button type="button" id="confirm-cancel" data-close class="ghost" autofocus>Keep playing</button>
      </div>
    </dialog>

    <script type="module" src="/src/pack/main.ts"></script>
  </body>
</html>
