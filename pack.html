<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Name them all. A map quiz in the spirit of Globle." />
    <title>The Counties</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <p id="eyebrow" class="eyebrow"></p>
        <h1 id="heading"></h1>
        <button id="help" class="icon-btn" type="button" aria-label="How to play">?</button>
      </header>

      <section class="stats" aria-label="Progress">
        <div>
          <span id="found-count">0</span>
          <small id="found-total"></small>
        </div>
        <div>
          <span id="timer">0:00</span>
          <small>time</small>
        </div>
        <div>
          <span id="guess-count">0</span>
          <small>guesses</small>
        </div>
        <div>
          <span id="best">—</span>
          <small>best</small>
        </div>
      </section>

      <main class="stage">
        <div class="map-wrap">
          <svg id="map"></svg>
        </div>

        <aside class="rail">
          <h2>Named</h2>
          <ul id="found-list"></ul>
          <p id="legend" class="legend"></p>
        </aside>
      </main>

      <footer class="dock">
        <p id="status" data-kind="idle"></p>
        <form id="guess-form">
          <label class="sr-only" id="guess-label" for="guess">Name</label>
          <input
            id="guess"
            name="guess"
            type="text"
            autocomplete="off"
            autocapitalize="words"
            spellcheck="false"
            placeholder=""
          />
          <button type="submit">Guess</button>
        </form>
        <div class="actions">
          <button id="give-up" type="button" class="ghost">Reveal remaining</button>
          <button id="start-over" type="button" class="ghost" hidden>Start over</button>
        </div>
        <p id="credit" class="credit"></p>
      </footer>
    </div>

    <dialog id="help-dialog" class="sheet">
      <h2>How to play</h2>
      <p id="help-intro"></p>
      <ul id="help-list"></ul>
      <button type="button" data-close>To the map</button>
    </dialog>

    <dialog id="win-dialog" class="sheet win">
      <h2 id="win-title"></h2>
      <p id="win-summary"></p>
      <div class="win-actions">
        <button type="button" id="share">Share</button>
        <button type="button" data-close class="ghost">Close</button>
      </div>
    </dialog>

    <script type="module" src="/src/pack/main.ts"></script>
  </body>
</html>
